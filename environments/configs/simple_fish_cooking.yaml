# Simple Fish Cooking Environment - For Validation
#
# This environment tests if agents can learn production chains.
# Optimal strategy: gather fish and wood, cook, consume cooked fish.

environment_name: "simple_fish_cooking"

# Grid configuration
grid_size: [2, 2]
episode_length: 24  # 24 hours per episode

# Resource locations
resources:
  fish:
    locations: [[0, 0]]
    regeneration_rate: inf  # Unlimited for simplicity

  wood:
    locations: [[1, 1]]
    regeneration_rate: inf

  # Note: water and apple removed to focus on fish cooking chain

# Agent configuration
agent_start: [0, 0]

# Training configuration
max_games: 500  # Train for 500 episodes

# Validation: Analytical optimal solution
optimal_strategy: |
  Optimal strategy for 24 hours:
  1. Hours 0-2: Produce fish at [0,0] → get 2 fish
  2. Hour 3: Move to wood at [1,1]
  3. Hours 4-5: Produce wood → get 2 wood
  4. Hour 6: Move away from wood (to allow cooking)
  5. Hour 7: Cook (2 fish + 1 wood → 2 cooked fish)
  6. Hours 8-9: Consume 2 cooked fish → +5.0 utility
  7. Hours 10-11: Move back to fish, repeat cycle

  Over 24 hours, can complete ~2.5 cycles.
  Expected utility: ~6 cooked fish * 2.5 utility = 15.0

optimal_utility: 15.0  # 6 cooked fish * 2.5 utility each

# Success criteria for validation
validation:
  min_utility: 13.5  # 90% of optimal
  expected_actions:
    produce: 0.50  # 50% of time producing
    move: 0.25     # 25% of time moving
    consume: 0.25  # 25% of time consuming
